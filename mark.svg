<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#14305c"/>
      <stop offset="1" stop-color="#081427"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a5fa8" stroke-opacity="0.25" stroke-width="1.5"/>
    </pattern>
    <clipPath id="c"><circle cx="400" cy="400" r="390"/></clipPath>
  </defs>
  <circle cx="400" cy="400" r="390" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#grid)" clip-path="url(#c)"/>
  <circle cx="400" cy="400" r="380" fill="none" stroke="#19c5ff" stroke-width="6"/>
  <!-- crosshair -->
  <g transform="translate(0 70)" stroke="#19c5ff" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="120" y1="330" x2="250" y2="330"/>
    <line x1="550" y1="330" x2="680" y2="330"/>
    <line x1="400" y1="110" x2="400" y2="165"/>
  </g>
  <!-- isometric cube -->
  <g transform="translate(0 70)" fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="400,190 521,260 521,400 400,470 279,400 279,260"/>
    <polyline points="279,260 400,330 521,260"/>
    <line x1="400" y1="330" x2="400" y2="470"/>
  </g>
  <polygon transform="translate(0 70)" points="400,330 521,260 521,400 400,470" fill="#19c5ff" fill-opacity="0.25"/>
  <circle cx="400" cy="400" r="16" fill="#ff8a1f"/>
  
</svg>
